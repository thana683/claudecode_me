<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>วันนี้กินไร</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@200;400;600;700&family=Inter:wght@200;400;600;700&display=swap');

  :root {
    --color-void: #000000;
    --color-bone-white: #ffffff;
    --color-ash-gray: #9a9a9a;
    --color-silver-mist: #bdbdbd;
    --color-electric-iris: #8052ff;
    --color-saffron-spark: #ffb829;
    --color-deep-verdant: #15846e;

    --font-sans: 'Noto Sans Thai', 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    --spacing-6: 6px;
    --spacing-12: 12px;
    --spacing-18: 18px;
    --spacing-24: 24px;
    --spacing-30: 30px;
    --spacing-36: 36px;
    --spacing-60: 60px;

    --radius-pill: 9999px;
    --radius-tags: 9999px;
    --radius-cards: 24px;
    --radius-buttons: 9999px;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    background: var(--color-void);
    color: var(--color-bone-white);
    font-family: var(--font-sans);
    font-weight: 200;
    padding-inline: 20px;
    padding-block: 48px 60px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .page {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: var(--spacing-60);
  }

  /* ---- brand header ---- */
  .brand {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: var(--spacing-12);
  }

  .brand h1 {
    font-family: var(--font-sans);
    font-weight: 400;
    font-size: clamp(2.6rem, 9vw, 3.6rem);
    line-height: 1.1;
    margin: 0;
    color: var(--color-bone-white);
    letter-spacing: -0.03em;
  }

  .brand p {
    margin: 0;
    color: var(--color-silver-mist);
    font-weight: 200;
    font-size: 18px;
    line-height: 1.5;
  }

  /* ---- stage / dish reveal ---- */
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--spacing-24);
  }

  .medallion {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.4rem;
    background: color-mix(in srgb, var(--color-electric-iris) 16%, var(--color-void));
    border: none;
    padding: 0;
    margin: 0;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  .medallion img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  .medallion:focus-visible {
    outline: 2px solid var(--color-electric-iris);
    outline-offset: 3px;
  }

  .dish-copy {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: var(--spacing-12);
    max-width: 36ch;
  }

  .dish-copy h2 {
    font-family: var(--font-sans);
    font-weight: 400;
    font-size: 42px;
    line-height: 1.2;
    letter-spacing: -0.02em;
    margin: 0;
    text-wrap: balance;
    cursor: pointer;
  }

  .dish-copy h2:hover { color: var(--color-saffron-spark); }

  .dish-copy p {
    margin: 0;
    color: var(--color-silver-mist);
    font-weight: 200;
    font-size: 18px;
    line-height: 1.5;
  }

  @keyframes reveal {
    from { opacity: 0; transform: translateY(6px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .dish-copy.revealing, .medallion.revealing {
    animation: reveal 0.4s ease-out;
  }

  @media (prefers-reduced-motion: reduce) {
    .dish-copy.revealing, .medallion.revealing { animation: none; }
  }

  .controls {
    display: flex;
    align-items: center;
    gap: var(--spacing-12);
    width: 100%;
    margin-top: var(--spacing-6);
  }

  button {
    font-family: var(--font-sans);
    border: none;
    cursor: pointer;
    background: transparent;
  }

  .roll-btn {
    flex: 1;
    background: var(--color-electric-iris);
    color: var(--color-bone-white);
    border-radius: var(--radius-buttons);
    padding: 14px 24px;
    font-weight: 600;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.025em;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .roll-btn:hover { background: color-mix(in srgb, var(--color-electric-iris) 85%, white); }
  .roll-btn:active { transform: scale(0.98); }
  .roll-btn:focus-visible { outline: 2px solid var(--color-electric-iris); outline-offset: 2px; }

  .heart-btn {
    width: 48px;
    height: 48px;
    flex: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    color: var(--color-ash-gray);
    transition: color 0.15s ease, transform 0.12s ease;
  }

  .heart-btn[aria-pressed="true"] { color: var(--color-saffron-spark); }
  .heart-btn:hover { color: var(--color-bone-white); }
  .heart-btn[aria-pressed="true"]:hover { color: var(--color-saffron-spark); }
  .heart-btn:active { transform: scale(0.92); }
  .heart-btn:focus-visible { outline: 2px solid var(--color-electric-iris); outline-offset: 2px; }

  /* ---- favorites ---- */
  .favorites {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-18);
  }

  .favorites h3 {
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.025em;
    color: var(--color-ash-gray);
    margin: 0;
    display: flex;
    align-items: baseline;
    gap: var(--spacing-6);
  }

  .favorites h3 .count {
    font-weight: 400;
    font-size: 14px;
    text-transform: none;
    letter-spacing: normal;
    color: var(--color-silver-mist);
  }

  .fav-list {
    display: flex;
    flex-direction: column;
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  .fav-row {
    display: flex;
    align-items: center;
    gap: var(--spacing-12);
    padding-block: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    cursor: pointer;
  }

  .fav-row:focus-visible {
    outline: 2px solid var(--color-electric-iris);
    outline-offset: -2px;
  }

  .fav-emoji {
    font-size: 1.4rem;
    flex: none;
    width: 36px;
    height: 36px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: var(--spacing-12);
    background: color-mix(in srgb, var(--color-electric-iris) 14%, var(--color-void));
  }

  .fav-emoji img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: var(--spacing-12);
  }

  .fav-text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .fav-text .name {
    font-weight: 400;
    font-size: 18px;
    color: var(--color-bone-white);
  }

  .fav-text .desc {
    color: var(--color-ash-gray);
    font-weight: 200;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .remove-btn {
    flex: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    color: var(--color-ash-gray);
    font-size: 1.1rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s ease;
  }

  .remove-btn:hover { color: var(--color-saffron-spark); }
  .remove-btn:focus-visible { outline: 2px solid var(--color-electric-iris); outline-offset: 2px; }

  .empty-favorites, .no-results {
    padding-block: 18px;
    color: var(--color-ash-gray);
    font-weight: 200;
    font-size: 14px;
    text-align: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  /* ---- favorites search & filter ---- */
  .fav-filters[hidden] { display: none; }

  .fav-filters {
    display: flex;
    gap: var(--spacing-12);
  }

  .fav-search {
    flex: 1;
    min-width: 0;
    padding: 12px 18px;
    border-radius: var(--radius-pill);
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: transparent;
    color: var(--color-bone-white);
    font-family: var(--font-sans);
    font-weight: 200;
    font-size: 14px;
  }

  .fav-search::placeholder { color: var(--color-ash-gray); }
  .fav-search:focus-visible { outline: 2px solid var(--color-electric-iris); outline-offset: 2px; }

  .fav-category {
    flex: none;
    max-width: 40%;
    padding: 12px 16px;
    border-radius: var(--radius-pill);
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: transparent;
    color: var(--color-bone-white);
    font-family: var(--font-sans);
    font-weight: 200;
    font-size: 14px;
    cursor: pointer;
  }

  .fav-category:focus-visible { outline: 2px solid var(--color-electric-iris); outline-offset: 2px; }

  /* ---- detail modal ---- */
  .modal-overlay[hidden] { display: none; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }

  .modal {
    position: relative;
    width: 100%;
    max-width: 440px;
    max-height: 85vh;
    overflow-y: auto;
    background: var(--color-void);
    border-radius: var(--radius-cards);
    padding: 36px 30px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--spacing-18);
  }

  .modal-close {
    position: absolute;
    top: var(--spacing-18);
    right: var(--spacing-18);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    color: var(--color-ash-gray);
    font-size: 1.3rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s ease;
  }

  .modal-close:hover { color: var(--color-saffron-spark); }
  .modal-close:focus-visible { outline: 2px solid var(--color-electric-iris); outline-offset: 2px; }

  .modal-media {
    width: 104px;
    height: 104px;
    border-radius: 50%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.8rem;
    background: color-mix(in srgb, var(--color-electric-iris) 16%, var(--color-void));
    flex: none;
  }

  .modal-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  .modal h2 {
    font-family: var(--font-sans);
    font-weight: 400;
    font-size: 27px;
    line-height: 1.2;
    margin: 0;
    text-align: center;
    color: var(--color-bone-white);
  }

  .modal-category {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.025em;
    color: var(--color-saffron-spark);
    margin: -10px 0 0;
  }

  .modal-desc {
    margin: 0;
    color: var(--color-silver-mist);
    font-weight: 200;
    font-size: 18px;
    line-height: 1.5;
    text-align: center;
  }

  .modal-ingredients-title {
    align-self: flex-start;
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.025em;
    color: var(--color-ash-gray);
    margin: var(--spacing-6) 0 0;
  }

  .modal-ingredients {
    align-self: stretch;
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: var(--spacing-6) var(--spacing-12);
  }

  .modal-ingredients li {
    background: rgba(255, 255, 255, 0.08);
    border-radius: var(--radius-tags);
    padding: 6px 16px;
    font-weight: 200;
    font-size: 14px;
    color: var(--color-bone-white);
  }
</style>
</head>
<body>

<div class="page">
  <header class="brand">
    <h1>วันนี้กินไร</h1>
    <p>สุ่มเมนูอาหารไทยสักจาน แล้วเก็บเมนูที่ถูกใจไว้ตรงนี้</p>
  </header>

  <section class="stage">
    <button class="medallion" id="medallion" type="button" aria-label="ดูรายละเอียดเมนูและส่วนประกอบ">🍜</button>
    <div class="dish-copy" id="dishCopy">
      <h2 id="dishName">กำลังสุ่ม…</h2>
      <p id="dishDesc"></p>
    </div>
    <div class="controls">
      <button class="roll-btn" id="rollBtn" type="button">สุ่มเมนูใหม่</button>
      <button class="heart-btn" id="heartBtn" type="button" aria-pressed="false" aria-label="เก็บเป็นเมนูโปรด">♡</button>
    </div>
  </section>

  <section class="favorites">
    <h3>เมนูที่ชอบ <span class="count" id="favCount">(0)</span></h3>
    <div class="fav-filters" id="favFilters" hidden>
      <input type="search" class="fav-search" id="favSearch" placeholder="ค้นหาเมนูโปรด…" aria-label="ค้นหาเมนูโปรด">
      <select class="fav-category" id="favCategory" aria-label="กรองตามหมวดหมู่">
        <option value="all">ทุกหมวด</option>
        <option value="คาว">คาว</option>
        <option value="แกง">แกง</option>
        <option value="ผัด">ผัด</option>
        <option value="ยำ">ยำ</option>
        <option value="ของหวาน">ของหวาน</option>
      </select>
    </div>
    <ul class="fav-list" id="favList"></ul>
  </section>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" type="button" aria-label="ปิดหน้าต่างรายละเอียด">×</button>
    <div class="modal-media" id="modalMedia"></div>
    <h2 id="modalTitle"></h2>
    <p class="modal-category" id="modalCategory"></p>
    <p class="modal-desc" id="modalDesc"></p>
    <h3 class="modal-ingredients-title">ส่วนประกอบ</h3>
    <ul class="modal-ingredients" id="modalIngredients"></ul>
  </div>
</div>

    { name: "ข้าวคลุกกะปิ", emoji: "🍚", desc: "ข้าวคลุกกะปิหอมผัดกับกุ้งแห้งและผักเคียง", category: "คาว", img: "image/khao-kluk-kapi.png", ingredients: ["ข้าวสวย", "กะปิ", "กุ้งแห้ง", "หมูหวาน", "ไข่เจียวซอย", "มะม่วงเปรี้ยวซอย", "ถั่วฝักยาวซอย"] }
  ];

  var FAV_KEY = "thai-food-favorites-v1";
  var currentIndex = -1;
  var favorites = [];
  var favSearchQuery = "";
  var favCategoryFilter = "all";

  var medallion = document.getElementById("medallion");
  var dishCopy = document.getElementById("dishCopy");
  var dishName = document.getElementById("dishName");
  var dishDesc = document.getElementById("dishDesc");
  var rollBtn = document.getElementById("rollBtn");
  var heartBtn = document.getElementById("heartBtn");
  var favList = document.getElementById("favList");
  var favCount = document.getElementById("favCount");
  var favFilters = document.getElementById("favFilters");
  var favSearch = document.getElementById("favSearch");
  var favCategory = document.getElementById("favCategory");
  var modalOverlay = document.getElementById("modalOverlay");
  var modalClose = document.getElementById("modalClose");
  var modalMedia = document.getElementById("modalMedia");
  var modalTitle = document.getElementById("modalTitle");
  var modalCategory = document.getElementById("modalCategory");
  var modalDesc = document.getElementById("modalDesc");
  var modalIngredients = document.getElementById("modalIngredients");
  var lastFocusedEl = null;

  function loadFavorites() {
    try {
      var raw = localStorage.getItem(FAV_KEY);
      favorites = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(favorites)) favorites = [];
    } catch (e) {
      favorites = [];
    }
  }

  function saveFavorites() {
    try {
      localStorage.setItem(FAV_KEY, JSON.stringify(favorites));
    } catch (e) {}
  }

  function isFavorite(name) {
    return favorites.indexOf(name) !== -1;
  }

  function renderDishVisual(container, dish) {
    container.innerHTML = "";
    var img = document.createElement("img");
    img.src = dish.img;
    img.alt = dish.name;
    img.loading = "lazy";
    img.addEventListener("error", function () {
      img.remove();
      container.textContent = dish.emoji;
    });
    container.appendChild(img);
  }

  function getFilteredFavorites() {
    var query = favSearchQuery.trim().toLowerCase();
    return favorites.filter(function (name) {
      var dish = dishes.find(function (d) { return d.name === name; });
      if (!dish) return false;
      if (favCategoryFilter !== "all" && dish.category !== favCategoryFilter) return false;
      if (query && dish.name.toLowerCase().indexOf(query) === -1) return false;
      return true;
    });
  }

  function renderFavorites() {
    favCount.textContent = "(" + favorites.length + ")";
    favList.innerHTML = "";

    if (favorites.length === 0) {
      favFilters.hidden = true;
      var empty = document.createElement("li");
      empty.className = "empty-favorites";
      empty.textContent = "ยังไม่มีเมนูโปรด กดหัวใจตอนสุ่มเจอเมนูที่ถูกใจ";
      favList.appendChild(empty);
      return;
    }

    favFilters.hidden = false;
    var visibleNames = getFilteredFavorites();

    if (visibleNames.length === 0) {
      var noResults = document.createElement("li");
      noResults.className = "no-results";
      noResults.textContent = "ไม่พบเมนูโปรดที่ตรงกับการค้นหา/ตัวกรอง";
      favList.appendChild(noResults);
      return;
    }

    visibleNames.forEach(function (name) {
      var dish = dishes.find(function (d) { return d.name === name; });
      if (!dish) return;

      var row = document.createElement("li");
      row.className = "fav-row";

      var emoji = document.createElement("span");
      emoji.className = "fav-emoji";
      renderDishVisual(emoji, dish);

      var text = document.createElement("div");
      text.className = "fav-text";
      var nameEl = document.createElement("span");
      nameEl.className = "name";
      nameEl.textContent = dish.name;
      var descEl = document.createElement("span");
      descEl.className = "desc";
      descEl.textContent = dish.desc;
      text.appendChild(nameEl);
      text.appendChild(descEl);

      var removeBtn = document.createElement("button");
      removeBtn.className = "remove-btn";
      removeBtn.type = "button";
      removeBtn.setAttribute("aria-label", "เอา " + dish.name + " ออกจากรายการโปรด");
      removeBtn.textContent = "×";
      removeBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        removeFavorite(dish.name);
      });

      row.tabIndex = 0;
      row.setAttribute("role", "button");
      row.setAttribute("aria-label", "ดูรายละเอียด " + dish.name);
      row.addEventListener("click", function (e) {
        if (e.target.closest(".remove-btn")) return;
        openDetail(dish);
      });
      row.addEventListener("keydown", function (e) {
        if (e.target.closest(".remove-btn")) return;
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openDetail(dish);
        }
      });

      row.appendChild(emoji);
      row.appendChild(text);
      row.appendChild(removeBtn);
      favList.appendChild(row);
    });
  }

  function addFavorite(name) {
    if (isFavorite(name)) return;
    favorites.unshift(name);
    saveFavorites();
    renderFavorites();
  }

  function removeFavorite(name) {
    var idx = favorites.indexOf(name);
    if (idx === -1) return;
    favorites.splice(idx, 1);
    saveFavorites();
    renderFavorites();
    updateHeartState();
  }

  function updateHeartState() {
    var dish = dishes[currentIndex];
    var active = dish && isFavorite(dish.name);
    heartBtn.setAttribute("aria-pressed", active ? "true" : "false");
    heartBtn.textContent = active ? "♥" : "♡";
    heartBtn.setAttribute("aria-label", active ? "เอาออกจากเมนูโปรด" : "เก็บเป็นเมนูโปรด");
  }

  function renderCurrentDish() {
    var dish = dishes[currentIndex];
    renderDishVisual(medallion, dish);
    dishName.textContent = dish.name;
    dishDesc.textContent = dish.desc;
    updateHeartState();

    [medallion, dishCopy].forEach(function (el) {
      el.classList.remove("revealing");
      void el.offsetWidth;
      el.classList.add("revealing");
    });
  }

  function openDetail(dish) {
    if (!dish) return;
    lastFocusedEl = document.activeElement;

    renderDishVisual(modalMedia, dish);
    modalTitle.textContent = dish.name;
    modalCategory.textContent = dish.category;
    modalDesc.textContent = dish.desc;

    modalIngredients.innerHTML = "";
    dish.ingredients.forEach(function (item) {
      var li = document.createElement("li");
      li.textContent = item;
      modalIngredients.appendChild(li);
    });

    modalOverlay.hidden = false;
    modalClose.focus();
  }

  function closeDetail() {
    modalOverlay.hidden = true;
    if (lastFocusedEl && typeof lastFocusedEl.focus === "function") {
      lastFocusedEl.focus();
    }
    lastFocusedEl = null;
  }

  function rollDish() {
    if (dishes.length === 0) return;
    var nextIndex = currentIndex;
    if (dishes.length === 1) {
      nextIndex = 0;
    } else {
      while (nextIndex === currentIndex) {
        nextIndex = Math.floor(Math.random() * dishes.length);
      }
    }
    currentIndex = nextIndex;
    renderCurrentDish();
  }

  rollBtn.addEventListener("click", rollDish);
  heartBtn.addEventListener("click", function () {
    var dish = dishes[currentIndex];
    if (!dish) return;
    if (isFavorite(dish.name)) {
      removeFavorite(dish.name);
    } else {
      addFavorite(dish.name);
    }
    updateHeartState();
  });

  favSearch.addEventListener("input", function () {
    favSearchQuery = favSearch.value;
    renderFavorites();
  });

  favCategory.addEventListener("change", function () {
    favCategoryFilter = favCategory.value;
    renderFavorites();
  });

  medallion.addEventListener("click", function () {
    openDetail(dishes[currentIndex]);
  });

  dishName.addEventListener("click", function () {
    openDetail(dishes[currentIndex]);
  });

  modalClose.addEventListener("click", closeDetail);

  modalOverlay.addEventListener("click", function (e) {
    if (e.target === modalOverlay) closeDetail();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !modalOverlay.hidden) closeDetail();
  });

  loadFavorites();
  renderFavorites();
  rollDish();
})();
</script>
